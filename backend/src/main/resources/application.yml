spring:
  application:
    name: storepro

  profiles:
    active: dev

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/storepro}
    username: ${SPRING_DATASOURCE_USERNAME:storepro}
    password: ${SPRING_DATASOURCE_PASSWORD:storepro123}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        default_schema: public
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: false

  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null
    time-zone: America/Sao_Paulo

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: 8080
  servlet:
    context-path: /api

# JWT Configuration
app:
  jwt:
    secret: c3RvcmVwcm8tc2VjcmV0LWtleS1mb3Itand0LXRva2VuLWdlbmVyYXRpb24tMjAyNA==
    expiration-ms: 86400000
    refresh-expiration-ms: 604800000

  # Cobranca automatica na maquininha PagBank (Moderninha Smart).
  # Desligado ate existir um token: com enabled=false o PDV segue no modo manual
  # e o botao "Cobrar na maquininha" nem aparece.
  terminal:
    enabled: ${TERMINAL_ENABLED:false}
    default-terminal-id: ${TERMINAL_ID:CAIXA01}
    # Segredo compartilhado com o app instalado na maquininha (X-Terminal-Token).
    agent-token: ${TERMINAL_AGENT_TOKEN:}
    timeout-seconds: ${TERMINAL_TIMEOUT_SECONDS:180}

  # PIX com QR Code na tela do PDV, pela API REST do PagBank.
  # Independente da maquininha: funciona sem app Android e sem homologacao.
  pagbank:
    enabled: ${PAGBANK_ENABLED:false}
    env: ${PAGBANK_ENV:sandbox}
    token: ${PAGBANK_TOKEN:}
    # CPF/CNPJ do pagador nas vendas de balcao sem cliente cadastrado.
    # O PagBank confere o digito verificador e recusa a cobranca sem ele.
    fallback-tax-id: ${PAGBANK_FALLBACK_TAX_ID:}
    fallback-customer-name: ${PAGBANK_FALLBACK_NAME:Consumidor}
    fallback-customer-email: ${PAGBANK_FALLBACK_EMAIL:naoinformado@danju.local}
    # URL publica que o PagBank chama ao confirmar o pagamento. Pode ficar vazia:
    # o PDV tambem consulta o status sozinho, so fica dependendo do polling.
    notification-url: ${PAGBANK_NOTIFICATION_URL:}
    qr-expiration-minutes: ${PAGBANK_QR_EXPIRATION_MINUTES:15}

# Swagger
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

# Logging
logging:
  level:
    root: INFO
    com.storepro: DEBUG
    org.springframework.security: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
